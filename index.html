<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Feet & Quantity Calculator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fb;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .row-container {
            margin-bottom: 20px;
        }
        .calc-row {
            display: grid;
            grid-template-columns: 2fr 2fr 2fr 2fr auto;
            gap: 15px;
            align-items: center;
            margin-bottom: 12px;
            background: #fdfdfd;
            padding: 10px;
            border: 1px solid #eef2f5;
            border-radius: 6px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 4px;
            font-weight: 600;
        }
        input {
            padding: 8px 12px;
            border: 1px solid #ccd1d9;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3498db;
        }
        .row-total-box {
            font-weight: bold;
            font-size: 15px;
            color: #2c3e50;
            padding-top: 20px;
        }
        button {
            cursor: pointer;
            font-weight: 600;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .btn-add {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn-add:hover {
            background-color: #27ae60;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-top: 18px;
        }
        .btn-delete:hover {
            background-color: #c0392b;
        }
        .summary-section {
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 15px 20px;
            border-radius: 0 6px 6px 0;
            margin-top: 25px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .summary-row.final {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            border-top: 1px solid #ddd;
            padding-top: 8px;
            margin-top: 8px;
        }
        .section-divider {
            margin: 40px 0 30px 0;
            border: 0;
            border-top: 2px dashed #e2e8f0;
        }
        .quick-calc {
            background: #fff8f0;
            border: 1px solid #fee2e2;
            padding: 20px;
            border-radius: 6px;
        }
        .quick-calc-inputs {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Measurement Area Calculator</h2>
    
    <!-- Add Row Trigger -->
    <button type="button" class="btn-add" onclick="addRow()">+ Add Row</button>
    
    <!-- Dynamic Rows Container -->
    <div id="rowContainer" class="row-container"></div>

    <!-- Summary Totals -->
    <div class="summary-section">
        <div class="summary-row">
            <span>Total Sum:</span>
            <span id="grandTotal">0.00</span>
        </div>
        <div class="summary-row final">
            <span>Final Area (Divided by 144):</span>
            <span id="finalSqFt">0.00</span>
        </div>
    </div>

    <hr class="section-divider">

    <!-- Secondary Amount Calculator -->
    <div class="quick-calc">
        <h3 style="margin-top:0; color: #d35400;">Quick Multiplier (Amount × Size)</h3>
        <div class="quick-calc-inputs">
            <div class="input-group">
                <label>Amount / Rate</label>
                <input type="number" id="quickAmount" value="38" oninput="calculateQuickTotal()">
            </div>
            <div style="font-weight: bold; margin-top: 15px;">×</div>
            <div class="input-group">
                <label>Size / Factor</label>
                <input type="number" id="quickSize" value="2" oninput="calculateQuickTotal()">
            </div>
            <div style="font-weight: bold; margin-top: 15px;">=</div>
            <div class="row-total-box" style="padding-top: 15px;">
                <span id="quickResult">76.00</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Automatically add the first row on page load
    window.onload = function() {
        addRow();
        calculateQuickTotal();
    };

    // Function to dynamically inject a new measurement row
    function addRow() {
        const container = document.getElementById('rowContainer');
        const rowId = 'row_' + Date.now();

        const rowHtml = `
            <div class="calc-row" id="${rowId}">
                <div class="input-group">
                    <label>First Size</label>
                    <input type="number" class="size1" value="0" oninput="calculateRowTotal(this)">
                </div>
                <div class="input-group">
                    <label>Second Size</label>
                    <input type="number" class="size2" value="0" oninput="calculateRowTotal(this)">
                </div>
                <div class="input-group">
                    <label>Quantity</label>
                    <input type="number" class="qty" value="1" oninput="calculateRowTotal(this)">
                </div>
                <div class="input-group">
                    <label>Row Total</label>
                    <div class="row-total-box"><span class="row-total">0.00</span></div>
                </div>
                <div>
                    <button type="button" class="btn-delete" onclick="deleteRow('${rowId}')">Delete</button>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHtml);
        updateGrandTotals();
    }

    // Function to drop a row out of the calculation matrix
    function deleteRow(rowId) {
        const row = document.getElementById(rowId);
        if (row) {
            row.remove();
            updateGrandTotals();
        }
    }

    // Compute subtotal for an individual row layout
    function calculateRowTotal(inputElement) {
        const row = inputElement.closest('.calc-row');
        const size1 = parseFloat(row.querySelector('.size1').value) || 0;
        const size2 = parseFloat(row.querySelector('.size2').value) || 0;
        const qty = parseFloat(row.querySelector('.qty').value) || 0;

        const total = size1 * size2 * qty;
        row.querySelector('.row-total').innerText = total.toFixed(2);

        updateGrandTotals();
    }

    // Accumulate all rows and execute the division operation
    function updateGrandTotals() {
        const rowTotals = document.querySelectorAll('.row-total');
        let sum = 0;

        rowTotals.forEach(box => {
            sum += parseFloat(box.innerText) || 0;
        });

        const dividedTotal = sum / 144;

        document.getElementById('grandTotal').innerText = sum.toFixed(2);
        document.getElementById('finalSqFt').innerText = dividedTotal.toFixed(2);
    }

    // Separate logic for the quick-calc section at the bottom
    function calculateQuickTotal() {
        const amount = parseFloat(document.getElementById('quickAmount').value) || 0;
        const size = parseFloat(document.getElementById('quickSize').value) || 0;
        
        const result = amount * size;
        document.getElementById('quickResult').innerText = result.toFixed(2);
    }
</script>

</body>
  </html>
